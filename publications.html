<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publications | VoiceUnheard</title>
    <style>
        /* General Body Styles */
        body {
            background-color: #FDF5E6; /* A light, creamy beige background */
            font-family: 'Georgia', 'Times New Roman', serif;
            margin: 0;
            padding: 2em;
        }


        .container {
            max-width: 1920px;
            width: 100%;
            margin: 0 auto; /* Add this line to center the container */
        }


        /* --- Header Section (Copied from index.html) --- */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.5em;
        }
        
        .header-left {
            display: flex;
            align-items: center;
        }

        .logo {
            margin-right: 1.5em;
            width: 80px;
        }

        .logo img {
            width: 100%;
            height: auto;
        }
        
        .title-section {
            display: flex;
            flex-direction: column;
        }

        h1 {
            font-size: 2.5em;
            margin: 0;
            padding: 0;
            color: #333;
        }

        .tagline {
            font-size: 1.2em;
            margin: 0;
            padding: 0;
            font-style: italic;
            color: #555;
        }

        nav ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            gap: 20px;
        }

        nav a {
            text-decoration: none;
            color: #780000;
            font-weight: bold;
            font-size: 1.1em;
            padding: 5px;
        }

        hr {
            border: 0;
            height: 2px;
            background-color: #780000;
            margin: 0.5em 0 2em 0;
        }
        /* --- End of Header Section --- */

        /* --- Dropdown Menu Styles (Copied from index.html) --- */
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none; /* Initially hidden */
            position: absolute;
            background-color: #f9f9f9;
            min-width: 250px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
            border-radius: 8px;
            padding: 0.5em 0;
            left: 50%;
            transform: translateX(-50%);
        }

        .dropdown-content.show {
            display: block;
        }

        .dropdown-item {
            display: block;
            padding: 0.75em 1.5em;
            transition: background-color 0.2s ease;
            text-decoration: none;
            color: #333;
            font-size: 0.95em;
        }

        .dropdown-item:hover {
            background-color: #e0e6eb;
        }
        /* --- End of Dropdown Styles --- */

        /* --- Publications Page Styles (from idx1.html) --- */

        .publications-section {
            width: 100%;
            max-width: 56rem; /* 896px, from max-w-4xl */
            margin-left: auto;
            margin-right: auto;
            text-align: center;
        }

        .publications-section h2 {
            font-size: 2.25rem; /* from text-4xl */
            font-weight: bold;
            margin-bottom: 3rem; /* from mb-12 */
            color: #780000; 
        }

        .topics-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem; /* from space-y-6 */
        }

        .topic-card {
            display: block;
            background-color: #FFFFFF; 
            border-radius: 0.5rem; /* rounded-lg */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); /* shadow-md */
            cursor: pointer;
            text-decoration: none;
            color: #333;
            transition: transform 0.2s, box-shadow 0.2s;
            overflow: hidden; 
        }

        .topic-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); /* shadow-lg */
        }

        .topic-title {
            background-color: #780000;
            color: #FDF5E6;
            font-size: 1.5rem; /* from text-2xl */
            font-weight: bold;
            padding: 0.75rem 1rem; /* from p-3 */
            text-align: left;
            border-radius: 0.5rem 0.5rem 0 0; /* rounded-t-lg */
            margin: 0; 
        }
        
        .topic-card p {
            padding: 0.75rem 1rem; /* from p-3 */
            text-align: left;
            margin: 0;
            background-color: #FDF5E6; 
            color: #780000; 
        }

    </style>
</head>
<body>

    <div class="container">
        
        <header>
            <div class="header-left">
                <div class="logo">
                    <img src="images/vu_logo.png" alt="VoiceUnheard Logo">
                </div>
                <div class="title-section">
                    <h1>VoiceUnheard</h1>
                    <p class="tagline">Iustitia: Let Justice Be Done</p>
                </div>
            </div>
            
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    
                    <li class="dropdown">
                        <a href="publications.html">Publications</a>
                        <div class="dropdown-content">
                            <a href="entry-1.html" class="dropdown-item">Topic 1</a>
                            <a href="entry-2.html" class="dropdown-item">Topic 2</a>
                            <a href="entry-3.html" class="dropdown-item">Topic 3</a>
                            <a href="entry-4.html" class="dropdown-item">Topic 4</a>
                        </div>
                    </li>
                    
                    <li><a href="aboutus.html">Who We Are</a></li>
                    <li><a href="contactus.html">Contact Us</a></li>
                </ul>
            </nav>
        </header>
        <hr>

        <main>
            <div class="publications-section">
                <h2>Publications</h2>

                <div class="topics-list">
                    
                    <a href="entry-1.html" class="topic-card">
                        <h3 class="topic-title">Topic 1</h3>
                        <p>Topic 1 Short Description.</p>
                    </a>

                    <a href="entry-2.html" class="topic-card">
                        <h3 class="topic-title">Topic 2</h3>
                        <p>Topic 2 Short Description.</p>
                    </a>

                    <a href="entry-3.html" class="topic-card">
                        <h3 class="topic-title">Topic 3</h3>
                        <p>Topic 3 Short Description.</p>
                    </a>

                    <a href="entry-4.html" class="topic-card">
                        <h3 class="topic-title">Topic 4</h3>
                        <p>Topic 4 Short Description.</p>
                    </a>

                </div>
            </div>
        </main>
    </div>

    <script>
        // Find the dropdown container element
        const dropdown = document.querySelector('.dropdown');
        const dropdownContent = document.querySelector('.dropdown-content');

        // Show the dropdown when the mouse enters the 'Publications' link area
        dropdown.addEventListener('mouseenter', function() {
            dropdownContent.classList.add('show');
        });

        // Hide the dropdown when the mouse leaves the area
        dropdown.addEventListener('mouseleave', function() {
            dropdownContent.classList.remove('show');
        });
    </script>

</body>
</html>
