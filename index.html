<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceUnheard - Home</title>
    <style>
        /* General Body Styles */
        body {
            background-color: #FDF5E6; /* A light, creamy beige background */
            font-family: 'Georgia', 'Times New Roman', serif;
            margin: 0;
            padding: 2em;
        }

        .container {
            max-width: 1100px; /* Wider container for the new layout */
            margin: 0 auto;
            width: 100%;
        }

        /* --- Header Section (Copied from index.html) --- */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.5em;
        }
        
        .header-left {
            display: flex;
            align-items: center;
        }

        .logo {
            margin-right: 1.5em;
            width: 80px;
        }

        .logo img {
            width: 100%;
            height: auto;
        }
        
        .title-section {
            display: flex;
            flex-direction: column;
        }

        h1 {
            font-size: 2.5em;
            margin: 0;
            padding: 0;
            color: #333;
        }

        .tagline {
            font-size: 1.2em;
            margin: 0;
            padding: 0;
            font-style: italic;
            color: #555;
        }

        nav ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            gap: 20px;
        }

        nav a {
            text-decoration: none;
            color: #8B0000;
            font-weight: bold;
            font-size: 1.1em;
            padding: 5px;
        }

        hr {
            border: 0;
            height: 2px;
            background-color: #8B0000;
            margin: 0.5em 0 2em 0;
        }
        /* --- End of Header Section --- */


        /* --- Homepage Grid Layout --- */
        .homepage-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            gap: 2em;
        }

        /* --- Clickable Card Styles (UPDATED FOR IMAGES) --- */
        .card {
            display: block;
            position: relative;
            text-decoration: none;
            color: white;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            
            /* These properties control the background image */
            background-size: cover;     /* Scales the image to cover the card */
            background-position: center; /* Centers the image */
            
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
            min-height: 250px; /* Ensures cards have a consistent height */
        }

        .card:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        /* Specific styles for the large, featured card */
        .card.featured {
            grid-column: 1 / 3; 
            min-height: 350px; /* A bit taller for the featured card */
        }

        /* Transparent Text Overlay */
        .card-text {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.6);
            padding: 1em 1.5em;
            transition: background 0.3s ease; 
        }

        .card:hover .card-text {
            background: rgba(0, 0, 0, 0.75);
        }

        .card-text h2 {
            margin: 0;
            font-size: 1.8em;
            line-height: 1.2;
        }

        .card-text p {
            margin: 0.25em 0 0 0;
            font-size: 0.9em;
            opacity: 0.9;
        }

    </style>
</head>
<body>

    <div class="container">

                </div>

                    <p class="tagline">Iustitia: Let Justice Be Done</p>
                </div>
            </div>
            
            <nav>

                    <li><a href="home.html">Home</a></li> 
                    <li><a href="aboutus.html">About Us</a></li>
                    <li><a href="index.html">Publication</a></li> 
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
        </header>

        <hr>

        <main>
            <div class="homepage-grid">
                
                <a href="entry-1.html" class="card featured" style="background-image: url('images/home-content-placeholderimage-small.png');">
                    <div class="card-text">
                        <h2>Lorem Ipsum</h2>
                        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Nullam pellentesque turpis ipsum, eget tincidunt nisi gravida accumsan.</p>
                    </div>
                </a>

                <a href="entry-2.html" class="card" style="background-image: url('images/home-content-placeholderimage.png');">
                    <div class="card-text">
                        <h2>Lorem Ipsum</h2>
                    </div>
                </a>

                <a href="entry-3.html" class="card" style="background-image: url('images/home-content-placeholderimage.png');">
                    <div class="card-text">
                        <h2>Lorem Ipsum</h2>
                    </div>
                </a>

                <a href="entry-4.html" class="card" style="background-image: url('images/home-content-placeholderimage.png');">
                    <div class="card-text">
                        <h2>Lorem Ipsum</h2>
                    </div>
                </a>

                <a href="aboutus.html" class="card" style="background-image: url('images/home-content-placeholderimage.png');">
                    <div class="card-text">
                        <h2>About Us</h2>
                    </div>
                </a>

            </div>
        </main>
    </div>

</body>
</html>
